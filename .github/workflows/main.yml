name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main  # CI: Run tests on PR to main branch
  push:
    branches:
      - main  # CD: Deploy app on merge to main

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests with Pytest
        run: pytest --exitfirst --verbosity=2

  deploy:
    name: deploy
    needs: test  # Deploy only if tests pass
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latests

    steps:


      - name: Deploy to Server
        run: |
          ssh user@your-server-ip <<EOF
            cd /path/to/your/app #ssh user1@ipaddress
            git pull origin main
            pip install -r requirements.txt
            systemctl restart fastapi.service
          EOF
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
