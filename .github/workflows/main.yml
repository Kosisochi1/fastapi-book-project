name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main  # CI: Run tests on PR to main branch
  push:
    branches:
      - main  # CD: Deploy app on merge to main1

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests with Pytest
        run: pytest tests/test_books.py

